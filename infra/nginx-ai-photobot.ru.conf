# Сайт ai-photobot.ru: лендинг, блог и дашборд — только статика из /var/www/landing.
# Перенос правил из infra/Caddyfile на общий nginx (сервер 89.19.209.92, Timeweb).
# HTTPS добавляет certbot --nginx: он дописывает listen 443 и сертификаты в эти блоки.

# www отправляем на основной адрес.
server {
    server_name www.ai-photobot.ru;

    return 301 https://ai-photobot.ru$request_uri;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-photobot.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-photobot.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name ai-photobot.ru;

    root /var/www/landing;
    index index.html;

    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Дашборд под паролем. ^~ — чтобы regex-локейшен статики ниже
    # не перехватил /dash/*.js и не отдал его без пароля.
    location ^~ /dash/ {
        auth_basic "dash";
        auth_basic_user_file /etc/nginx/ai-photobot.htpasswd;
        try_files $uri $uri/ =404;
    }

    # Картинки, шрифты, стили — кэш навсегда.
    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff|woff2|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Короткий кэш, чтобы обновления доходили до поисковиков.
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai-photobot.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai-photobot.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = ai-photobot.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ai-photobot.ru;
    return 404; # managed by Certbot


}
server {
    if ($host = www.ai-photobot.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.ai-photobot.ru;
    return 404; # managed by Certbot


}